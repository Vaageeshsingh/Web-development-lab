<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Expense Tracker</title>
</head>
<body>
  <h1> EXPENSE TRACKER</h1>
    <div id="container">
        <h1>Add Expense </h1>
        <div class="input-section">
            <input type="text" id="name" placeholder="Expense Name" />
            <input type="number" id="amount" placeholder="Amount" />
            <select id="category">
                <option value="food">Food</option>
                <option value="travel">Travel</option>
                <option value="shopping">Shopping</option>
                <option value="education">Education</option>
                <option value="others">Others</option>
            </select>
            <button id="addBtn">Add Expense</button>
            <button id="delBtn">Delete Expense</button>
        </div>
        <div class="task-counter">
              <p>Name : <span id="expenseName">0</span></p> 
            <p>Amount : <span id="expenseAmount">0</span></p>
            <p>Category : <span id="expenseCategory">0</span></p> 
        
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
